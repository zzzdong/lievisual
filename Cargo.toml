[package]
name = "lievisual"
version = "0.2.2"
edition = "2024"
rust-version = "1.92"
authors = ["zzzdong <kuwater@163.com>"]
description = "Declarative visual scene IR + pluggable rendering backends (SVG / vello_cpu / GPU)."
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/lievisual"
repository = "https://github.com/zzzdong/lievisual"
homepage = "https://github.com/zzzdong/lievisual"
keywords = ["graphics", "svg", "vello", "render", "scene"]
categories = ["graphics", "rendering", "visualization"]
exclude = ["*.png", "*.svg"]

[dependencies]
# 几何基础：f64 精度，与 vello_cpu / parley 内部 kurbo 版本对齐
kurbo = "0.13"
# CPU 栅格化后端（内部 kurbo 0.13 / peniko 0.6）
vello_cpu = "0.2"
# 文本排版（Canvas 风格 API 基于 parley）
parley = "0.11"
# 字形轮廓（glyph id → 贝塞尔路径，供 PDF/DOCX 矢量文本保真）
skrifa = "0.46"
# PNG 编解码：自包含位图（Pixmap）的 PNG 编码（SVG 内嵌 / render_png 导出）与解码（from_png）
png = "0.18"
# 额外图片编解码（jpeg/webp/gif 等解码），经 `extra-image-codecs` feature 开启。
# 默认不启用：lievisual 图片以已解码 RGBA8 位图进入 IR，解码是调用方职责。
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[features]
default = []
# 启用基于 `image` 的额外编解码：提供 `SceneImage::from_encoded` 等从非 PNG 字节解码的入口。
extra-image-codecs = ["dep:image"]
